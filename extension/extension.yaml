name: custom:file-monitor
version: "1.1.0"
minDynatraceVersion: "1.239"
author:
  name: "Your Company Name"

python:
  runtime: "python3"
  modules:
    - name: file_monitor
      entrypoint: file_monitor.__main__:main

metrics:
  - key: custom.file.exists
    metadata:
      displayName: File Exists
      unit: Count
      description: "1 if the file exists, 0 if not found"
  - key: custom.file.size_bytes
    metadata:
      displayName: File Size
      unit: Byte
      description: Current size of the monitored file in bytes
  - key: custom.file.age_seconds
    metadata:
      displayName: File Age
      unit: Second
      description: Seconds since the file was last modified
  - key: custom.file.line_count
    metadata:
      displayName: File Line Count
      unit: Count
      description: Number of lines (text files only, requires count_lines=true)
  - key: custom.file.change_age_seconds
    metadata:
      displayName: File Metadata Change Age
      unit: Second
      description: >
        Seconds since the file's metadata last changed (ctime).
        On Unix this reflects permission/owner/link changes; on Windows it is the creation time.
  - key: custom.file.mode
    metadata:
      displayName: File Mode
      unit: Count
      description: >
        Numeric permission bits of the file (e.g. 420 = 0o644 = rw-r--r--).
        Alert on unexpected changes to detect permission drift.
  - key: custom.file.owner_uid
    metadata:
      displayName: File Owner UID
      unit: Count
      description: >
        Numeric user ID of the file owner (Unix only; not reported on Windows).
        The owner name is available in the file_owner dimension. Alert on changes to detect ownership drift.

topology:
  types:
    - name: custom:file-monitor
      displayName: File Monitor
      enabled: true
      rules:
        - idPattern: "file-{file_path}"
          instanceNamePattern: "{file_path}"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.file)"
          attributes:
            - pattern: "{file_path}"
              key: file_path
              displayName: File Path
            - pattern: "{file_owner}"
              key: file_owner
              displayName: File Owner
            - pattern: "{file_group}"
              key: file_group
              displayName: File Group
            - pattern: "{file_mountpoint}"
              key: file_mountpoint
              displayName: Mount Point
            - pattern: "{file_mode_octal}"
              key: file_mode_octal
              displayName: File Mode (octal)

screens:
  - entityType: custom:file-monitor
    listSettings:
      staticContent:
        header:
          title: File Monitors
    detailsSettings:
      staticContent:
        showProblems: true
        showProperties: true
        showTags: true
    propertiesCard:
      properties:
        - type: ATTRIBUTE
          attribute:
            key: file_path
            displayName: File Path
        - type: ATTRIBUTE
          attribute:
            key: file_owner
            displayName: Owner
        - type: ATTRIBUTE
          attribute:
            key: file_group
            displayName: Group
        - type: ATTRIBUTE
          attribute:
            key: file_mountpoint
            displayName: Mount Point
        - type: ATTRIBUTE
          attribute:
            key: file_mode_octal
            displayName: Mode (octal)
    chartsCards:
      - key: file-size-card
        displayName: File Size & Age
        charts:
          - displayName: File Size (bytes)
            metrics:
              - metricSelector: "custom.file.size_bytes:splitBy(\"file_path\")"
          - displayName: File Age (seconds)
            metrics:
              - metricSelector: "custom.file.age_seconds:splitBy(\"file_path\")"
      - key: file-health-card
        displayName: File Health
        charts:
          - displayName: File Exists
            metrics:
              - metricSelector: "custom.file.exists:splitBy(\"file_path\")"
          - displayName: Line Count
            metrics:
              - metricSelector: "custom.file.line_count:splitBy(\"file_path\")"
      - key: file-meta-card
        displayName: File Metadata
        charts:
          - displayName: Metadata Change Age (seconds)
            metrics:
              - metricSelector: "custom.file.change_age_seconds:splitBy(\"file_path\")"
          - displayName: File Mode (numeric)
            metrics:
              - metricSelector: "custom.file.mode:splitBy(\"file_path\",\"file_mode_octal\")"
          - displayName: File Owner UID
            metrics:
              - metricSelector: "custom.file.owner_uid:splitBy(\"file_path\",\"file_owner\")"

dashboards:
  - path: "dashboards/overview.json"

activationSchema:
  types:
    endpoint:
      displayName: File to Monitor
      properties:
        file_path:
          displayName: File Path
          description: Absolute path to the file to monitor (e.g. /var/log/app.log)
          type: text
          nullable: false
          default: ""
        count_lines:
          displayName: Count Lines
          description: Count lines on each poll — disable for large binary files
          type: boolean
          nullable: false
          default: false
  properties:
    endpoints:
      displayName: Files
      description: One entry per file you want to monitor
      type:
        $ref: "#/types/endpoint"
      nullable: false
      items:
        constraints: []
      default: []
